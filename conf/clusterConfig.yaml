clusterconfig:
  typemeta:
    kind: ClusterConfiguration
    apiversion: kubeadm.k8s.io/v1beta4
  etcd:
  {{- if .Values.etcd.external }}
    external:
      endpoints:
      {{- range $k, $v := .Values.etcd.external.endpoints }}
        - {{ $v | quote }}
      {{- end }}
      caFile: "/etc/kubernetes/pki/etcd/ca.crt"
      certFile: "/etc/kubernetes/pki/etcd/healthcheck-client.crt"
      keyFile: "/etc/kubernetes/pki/etcd/healthcheck-client.key"
  {{- else }}
    local:
      imagemeta:
        imagerepository: ""
        imagetag: {{ .Values.etcd.local.imageTag }}
      datadir: {{ .Values.etcd.local.dataDir }}
      extraargs:{{ toYaml .Values.etcd.local.extraArgs | nindent 8 }}
      servercertsans: []
      peercertsans: []
    external: null
  {{- end }}
  networking:
    servicesubnet: {{ .Values.serviceCIDR }}
    podsubnet: {{ .Values.podCIDR }}
    dnsdomain: cluster.local
  kubernetesversion: {{ .Values.kubeVersion }}
  controlplaneendpoint: {{ if .Values.clusterAPI }}{{ .Values.clusterAPI }}:6443{{ end }}
  apiserver:
    controlplanecomponent:
      extraargs:
        {{- if .Values.secure }}
        audit-log-maxage: "30"
        audit-log-maxbackup: "10"
        audit-log-maxsize: "100"
        audit-log-mode: batch
        audit-log-path: /var/log/kube-api-audit/audit.log
        audit-policy-file: "{{ .Values.auditPolicy.location }}"
        {{- end }}
        authorization-mode: Node,RBAC
        default-not-ready-toleration-seconds: "30"
        default-unreachable-toleration-seconds: "30"
        {{- if .Values.secure }}
        encryption-provider-config: /etc/kubernetes/secrets_encryption.yaml
        {{- end }}
        kubelet-certificate-authority: /etc/kubernetes/pki/ca.crt
        profiling: "false"
        request-timeout: 60s
        tls-min-version: VersionTLS13
      {{- if .Values.secure }}
      extravolumes:
      - name: audit
        hostpath: {{ .Values.auditPolicy.location }}
        mountpath: {{ .Values.auditPolicy.location }}
        readonly: true
        pathtype: File
      - name: audit-log
        hostpath: /var/log/kube-api-audit/
        mountpath: /var/log/kube-api-audit/
        readonly: false
        pathtype: DirectoryOrCreate
      - name: secret-encryption
        hostpath: /etc/kubernetes/secrets_encryption.yaml
        mountpath: /etc/kubernetes/secrets_encryption.yaml
        readonly: true
        pathtype: File
      {{- else }}
      extravolumes: []
      {{- end }}
    certsans:
    {{- if .Values.clusterAPI }}
    - {{ .Values.clusterAPI }}
    {{- end }}
    timeoutforcontrolplane: null
  controllermanager:
    extraargs:
      bind-address: 0.0.0.0
      node-monitor-grace-period: 20s
      node-monitor-period: 2s
      profiling: "false"
      terminated-pod-gc-threshold: "10"
      tls-min-version: VersionTLS13
    extravolumes: []
  scheduler:
    extraargs:
      bind-address: 0.0.0.0
      profiling: "false"
    extravolumes: []
  dns:
    imagemeta:
      imagerepository: ""
      imagetag: ""
  certificatesdir: /etc/kubernetes/pki
  imagerepository: r.shturval.tech
  featuregates: {}
  clustername: {{ .Release.Name }}
