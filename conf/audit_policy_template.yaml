apiVersion: audit.k8s.io/v1
kind: Policy
# Собирать события только когда система сформировала ответ
omitStages:
  - "RequestReceived"
  - "ResponseStarted"
rules:
  # Логирование прочих событий на уровне метадата
  - level: Metadata
    omitStages:
      - "RequestReceived"
      - "ResponseStarted"
