{{- if and (.Values.capy.createIdentity | default true) (include "capy-cluster.saKey" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "capy-cluster.credentialsSecretName" . }}
  namespace: {{ .Values.capy.identityNamespace | default "capy-system" }}
  labels:
    {{- include "capy-cluster.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "capy-cluster.credentialsKeyName" . }}: {{ include "capy-cluster.saKey" . | b64enc | quote }}
{{- end }}
