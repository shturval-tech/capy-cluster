{{- range $k, $v := .Values.workerNodes }}
apiVersion: infrastructure.cluster.x-k8s.io/v1alpha1
kind: YandexMachineTemplate
metadata:
  name: {{ $.Release.Name }}-{{ $k }}
  namespace: {{ $.Release.Name }}
  labels:
    cluster-name: {{ $.Release.Name }}
    cluster.x-k8s.io/cluster-name: {{ $.Release.Name }}
    node-role.kubernetes.io/{{ include "capy-cluster.nodeRole" $k }}: ""
    {{- include "capy-cluster.labels" $ | nindent 4 }}
spec:
  template:
    spec:
{{- include "capy-cluster.yandexMachineSpec" (dict "root" $ "group" $v "name" $k) | nindent 6 }}
---
{{- end }}
