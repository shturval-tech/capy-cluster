apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-grafana-datasource
  namespace: {{ .Release.Name }}
  labels:
    grafana_datasource: "true"
  {{- include "capsm-cluster-grafana.labels" . | nindent 4 }}
data:
  {{ .Release.Name }}-datasource.yaml: {{ include "capsm-cluster-grafana.dataSource" . }}
type: Opaque